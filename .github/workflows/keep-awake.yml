# Mantém o Fin360 acordado no Streamlit Community Cloud.
#
# Community Cloud (plano free) dorme o app depois de um tempo sem
# visitante — ping periódico na URL conta como visita e reseta esse
# relógio. Intervalo de 10 min: este repositório é público, então os
# runners padrão não consomem a cota mensal de minutos do GitHub Free.
#
# Achado 2026-08-29 (conferido na API de execuções do GitHub, não só
# suposição): o `schedule` do GitHub Actions é "melhor esforço" — a
# doc oficial avisa que atrasa mais em horário de pico, e o pico é
# justamente no início de cada hora/meia hora. Rodando com
# "*/30 * * * *" (dispara exatamente em :00/:30, o pior minuto possível),
# o intervalo REAL entre execuções ficou de 3h a 7h, não 30 min — longe
# do previsto. Agora há seis oportunidades por hora, todas deslocadas
# dos minutos de maior disputa. Ainda é best-effort — se o app dormir
# mesmo assim, considerar um pinger
# externo (ex. UptimeRobot/cron-job.org), que não sofre esse atraso por
# rodar fora da fila do GitHub Actions.
#
# Incidente 2026-09-14 — DIAGNÓSTICO ORIGINAL CORRIGIDO EM 2026-09-18,
# ver achado abaixo. Registrado aqui por transparência, não repetir:
# achou-se então que a causa era "Sharing > Who can view this app"
# ter saído de público em share.streamlit.io. Guardado como hipótese
# até a checagem de 09-18 provar que a configuração sempre esteve
# correta (print do painel confirmado pelo usuário).
#
# Achado 2026-09-18 (causa raiz de verdade, resolvida sem nenhuma ação
# manual no painel do Streamlit Cloud): o `curl` deste step nunca
# habilitou o motor de cookies. Desde ~2026-09-04, o Streamlit
# Community Cloud passou a validar a visita com um handshake de 2
# saltos MESMO em app público: fin360.streamlit.app -> redireciona pra
# share.streamlit.io/-/auth/app (que emite um cookie de sessão) ->
# redireciona pra fin360.streamlit.app/-/login?payload=... (emite outro
# cookie) -> volta pra URL original. Sem guardar esses cookies entre os
# 3 saltos, o curl nunca consegue provar que já passou pelo handshake
# — o servidor reinicia o ciclo do zero pra sempre, até estourar
# `--max-redirs` (curl sai com código 47, sem nunca chegar no app de
# verdade). Reproduzido e confirmado localmente: o mesmo curl, com
# `-b ""` (habilita o motor de cookies em memória, sem precisar de
# arquivo), resolve em só 3 redirecionamentos e HTTP 200. Corrigido
# abaixo com essa única flag.
#
# Nota à parte, também verificada em 2026-09-18 e SEM problema: a
# versão de Python selecionada no painel (3.14.7) resolve os 50
# pacotes do `requirements.txt` sem conflito, com
# `streamlit==1.57.0` "Found ... in the environment" batendo exato
# com o pin da lição 26 (docs/04) — build saudável, não é causa de
# nada aqui.
name: Keep Fin360 awake

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping fin360.streamlit.app
        run: |
          set +e
          SAIDA=$(curl --silent --show-error --location --max-redirs 8 -b "" \
            --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 60 \
            --user-agent "Fin360-keep-awake/1.0" \
            --output /dev/null \
            --write-out "%{http_code}|%{url_effective}" \
            "https://fin360.streamlit.app/?keepalive=$(date +%s)")
          CURL_RC=$?
          set -e
          if [[ $CURL_RC -ne 0 ]]; then
            if [[ $CURL_RC -eq 47 ]]; then
              echo "::error::curl esgotou o limite de 8 redirecionamentos (codigo 47) tentando abrir fin360.streamlit.app, mesmo com o motor de cookies habilitado (-b). Se isso voltar a acontecer, o handshake de sessao do Streamlit Community Cloud mudou de novo -- conferir com um navegador real antes de assumir que e a config de Sharing (ja foi checada em 2026-09-18 e estava correta)."
            else
              echo "::error::curl falhou com codigo $CURL_RC antes de completar a requisicao (timeout/DNS/TLS) -- ver https://curl.se/libcurl/c/libcurl-errors.html."
            fi
            exit 1
          fi
          CODIGO_HTTP="${SAIDA%%|*}"
          URL_FINAL="${SAIDA#*|}"
          echo "HTTP $CODIGO_HTTP -> $URL_FINAL"
          if [[ "$URL_FINAL" == *"share.streamlit.io"* || "$URL_FINAL" == *"/-/login"* || "$URL_FINAL" == *"/-/auth"* ]]; then
            echo "::error::Ping caiu na tela de login do Streamlit Community Cloud ($URL_FINAL) em vez do app, mesmo com cookies habilitados. Com o motor de cookies ligado isso deixa de ser falso-positivo do handshake normal -- agora e sinal real de que Settings > Sharing > 'Who can view this app' pode ter saido de publico. Confirmar no painel do app antes de mexer em qualquer coisa."
            exit 1
          fi
          if [[ "$CODIGO_HTTP" != "200" ]]; then
            echo "::error::HTTP $CODIGO_HTTP inesperado (url final: $URL_FINAL)."
            exit 1
          fi
